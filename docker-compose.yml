services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: seats
      POSTGRES_USER: seats
      POSTGRES_PASSWORD: seats
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seats -d seats"]
      interval: 2s
      timeout: 2s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: seats
      PGUSER: seats
      PGPASSWORD: seats
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-production-0123456789}
      ADMIN_KEY: ${ADMIN_KEY:-dev-admin-key}
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
