spring:
  application:
    name: seat-reservation
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:seats}
    username: ${PGUSER:seats}
    password: ${PGPASSWORD:seats}
    hikari:
      # Postgres does the work; more connections than cores just adds lock/CPU contention there.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      # A burst queues for a connection (virtual threads make waiting cheap) instead of failing;
      # if no connection frees up within this window the request gets an explicit 503.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      # money is integer paise: reject 250.5 instead of silently truncating it to 250
      accept-float-as-int: false
      fail-on-unknown-properties: false

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
    ttl: ${JWT_TTL:24h}
  admin-key: ${ADMIN_KEY:dev-admin-key}

server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    # with virtual threads, connections (not threads) are the limit; let a stampede queue rather than be refused
    max-connections: ${TOMCAT_MAX_CONNECTIONS:20000}
    accept-count: ${TOMCAT_ACCEPT_COUNT:10000}

logging:
  structured:
    format:
      # JSON lines (ECS) with MDC request_id and key-value pairs; set LOG_FORMAT=logstash for that schema
      console: ${LOG_FORMAT:ecs}

info:
  app:
    # Railway injects the deployed commit; lets anyone verify which build is live via /actuator/info
    commit: ${RAILWAY_GIT_COMMIT_SHA:local}
    deployment: ${RAILWAY_DEPLOYMENT_ID:local}

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        # liveness: is the JVM alive? never depends on the DB (a DB outage must not restart-loop us)
        liveness:
          include: livenessState
        # readiness: can we serve traffic? fails closed when Postgres is unreachable
        readiness:
          include: readinessState,database
